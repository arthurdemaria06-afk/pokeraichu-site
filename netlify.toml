# Poké-Raichu : le site a déménagé sur https://pokeraichu.com (Cloudflare).
# L'ancienne adresse pokeraichu.netlify.app renvoie chaque page vers la même page de la nouvelle adresse
# (liens courts /r/ et /s/ des QR codes compris), dès que Netlify publie cette version.
[build]
  command = "echo Redirection vers pokeraichu.com"
  publish = "."

[[redirects]]
  from = "/*"
  to = "https://pokeraichu.com/:splat"
  status = 301
  force = true
